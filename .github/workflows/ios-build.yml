name: iOS Build

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  legacy-ios13:
    name: Legacy iOS 13 / Xcode 15.4
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned zonoe Zsign package
        run: |
          set -euo pipefail
          git clone https://github.com/Nyasami/Ksign.git upstream-ksign
          git -C upstream-ksign checkout 03a3a9c86897d79f9faf8106037b9971841d56a0
          git -C upstream-ksign submodule update --init --recursive
          test "$(git -C upstream-ksign/Zsign rev-parse HEAD)" = "6ffe703df73ef9069adacdbb19d571f11a69a801"
          curl -fLsS --retry 3 -o /tmp/zonoe-provision.patch https://raw.githubusercontent.com/a7987083/UnitXP_SP3-Moonstone/v3.0.0-alphaone13/HFASign/patches/0017-Fix-Zsign-removeProvision-semantics.patch
          git -C upstream-ksign/Zsign apply --check /tmp/zonoe-provision.patch
          git -C upstream-ksign/Zsign apply /tmp/zonoe-provision.patch
          mkdir -p Vendor
          cp -R upstream-ksign/Zsign Vendor/Zsign
          # Export a stable C ABI from the existing zonoe OpenSSL implementation.
          cat >> Vendor/Zsign/src/openssl_tools.mm <<'ZN_P12_BRIDGE'
          extern "C" bool zn_p12_verify(const char *p12Path, const char *provisionPath, const char *password) {
              if (!p12Path || !provisionPath || !password) return false;
              NSString *p12 = [NSString stringWithUTF8String:p12Path];
              NSString *provision = [NSString stringWithUTF8String:provisionPath];
              NSString *pass = [NSString stringWithUTF8String:password];
              if (!p12 || !provision || !pass) return false;
              password_check_fix_WHAT_THE_FUCK(provision);
              bool valid = p12_password_check(p12, pass);
              password_check_fix_WHAT_THE_FUCK_free(provision);
              return valid;
          }
          ZN_P12_BRIDGE
          test -f Vendor/Zsign/Package.swift
          echo "Native verifier source and public header locations:"
          sed -n '1,110p' upstream-ksign/Zsign/src/openssl_tools.mm
          find upstream-ksign/Zsign -iname '*.h' -o -iname '*.modulemap' | head -35
          # Verify the native PKCS12 functions used by zonoe 3.0.0 are actually provided.
          if grep -R -n -E 'p12_password_check|password_check_fix_WHAT_THE_FUCK' upstream-ksign/Zsign upstream-ksign/Ksign --include='*.c' --include='*.cpp' --include='*.h' --include='*.mm' --include='*.swift'; then
            echo "PKCS12 native implementation reference found"
          else
            echo "PKCS12 native symbols not found in restored sources; native bridge requires separate implementation"
          fi


      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Xcode version
        run: xcodebuild -version

      - name: Build GameStore for iOS 13 deployment target
        run: |
          set -o pipefail
          xcodebuild \
            -skipPackagePluginValidation \
            -project GameStore.xcodeproj \
            -scheme GameStore \
            -configuration Debug \
            -sdk iphonesimulator \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild-legacy.log

      - name: Build unsigned device app
        run: |
          set -o pipefail
          rm -rf DerivedDataDevice
          xcodebuild \
            -skipPackagePluginValidation \
            -project GameStore.xcodeproj \
            -scheme GameStore \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath DerivedDataDevice \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild-device.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="DerivedDataDevice/Build/Products/Debug-iphoneos/GameStore.app"
          test -d "$APP_PATH"
          test -s "$APP_PATH/Frameworks/OpenSSL.framework/OpenSSL"
          otool -L "$APP_PATH/GameStore" | grep -F "@rpath/OpenSSL.framework/OpenSSL"
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/GameStore.app
          (
            cd ipa
            /usr/bin/zip -qry ../GameStore-v0.2.10-dev-unsigned.ipa Payload
          )
          /usr/bin/unzip -l GameStore-v0.2.10-dev-unsigned.ipa | tee ipa-contents.log
          test -s GameStore-v0.2.10-dev-unsigned.ipa
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PATH/Info.plist" | grep -Fx "0.2.10"
          /usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP_PATH/Info.plist" | grep -Fx "11"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GameStore-v0.2.10-dev-unsigned-ipa
          path: GameStore-v0.2.10-dev-unsigned.ipa
          if-no-files-found: error

      - name: Upload legacy build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-legacy-logs
          path: |
            xcodebuild-legacy.log
            xcodebuild-device.log
            ipa-contents.log
          if-no-files-found: ignore

  modern-ios26:
    name: Modern iOS 26 SDK / Xcode 26.6
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned zonoe Zsign package
        run: |
          set -euo pipefail
          git clone https://github.com/Nyasami/Ksign.git upstream-ksign
          git -C upstream-ksign checkout 03a3a9c86897d79f9faf8106037b9971841d56a0
          git -C upstream-ksign submodule update --init --recursive
          test "$(git -C upstream-ksign/Zsign rev-parse HEAD)" = "6ffe703df73ef9069adacdbb19d571f11a69a801"
          curl -fLsS --retry 3 -o /tmp/zonoe-provision.patch https://raw.githubusercontent.com/a7987083/UnitXP_SP3-Moonstone/v3.0.0-alphaone13/HFASign/patches/0017-Fix-Zsign-removeProvision-semantics.patch
          git -C upstream-ksign/Zsign apply --check /tmp/zonoe-provision.patch
          git -C upstream-ksign/Zsign apply /tmp/zonoe-provision.patch
          mkdir -p Vendor
          cp -R upstream-ksign/Zsign Vendor/Zsign
          # Export a stable C ABI from the existing zonoe OpenSSL implementation.
          cat >> Vendor/Zsign/src/openssl_tools.mm <<'ZN_P12_BRIDGE'
          extern "C" bool zn_p12_verify(const char *p12Path, const char *provisionPath, const char *password) {
              if (!p12Path || !provisionPath || !password) return false;
              NSString *p12 = [NSString stringWithUTF8String:p12Path];
              NSString *provision = [NSString stringWithUTF8String:provisionPath];
              NSString *pass = [NSString stringWithUTF8String:password];
              if (!p12 || !provision || !pass) return false;
              password_check_fix_WHAT_THE_FUCK(provision);
              bool valid = p12_password_check(p12, pass);
              password_check_fix_WHAT_THE_FUCK_free(provision);
              return valid;
          }
          ZN_P12_BRIDGE
          test -f Vendor/Zsign/Package.swift
          # Verify the native PKCS12 functions used by zonoe 3.0.0 are actually provided.
          if grep -R -n -E 'p12_password_check|password_check_fix_WHAT_THE_FUCK' upstream-ksign/Zsign upstream-ksign/Ksign --include='*.c' --include='*.cpp' --include='*.h' --include='*.mm' --include='*.swift'; then
            echo "PKCS12 native implementation reference found"
          else
            echo "PKCS12 native symbols not found in restored sources; native bridge requires separate implementation"
          fi


      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Xcode version
        run: xcodebuild -version

      - name: Build GameStore against iOS 26 SDK
        run: |
          set -o pipefail
          xcodebuild \
            -skipPackagePluginValidation \
            -project GameStore.xcodeproj \
            -scheme GameStore \
            -configuration Debug \
            -sdk iphonesimulator \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild-modern.log

      - name: Upload modern build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-modern-log
          path: xcodebuild-modern.log
