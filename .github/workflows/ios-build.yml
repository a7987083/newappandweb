name: iOS Build

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  legacy-ios13:
    name: Legacy iOS 13 / Xcode 15.4
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned zonoe Zsign package
        run: |
          set -euo pipefail
          git clone https://github.com/Nyasami/Ksign.git upstream-ksign
          git -C upstream-ksign checkout 03a3a9c86897d79f9faf8106037b9971841d56a0
          git -C upstream-ksign submodule update --init --recursive
          test "$(git -C upstream-ksign/Zsign rev-parse HEAD)" = "6ffe703df73ef9069adacdbb19d571f11a69a801"
          mkdir -p Vendor
          cp -R upstream-ksign/Zsign Vendor/Zsign
          curl -fLsS --retry 3 -o /tmp/zonoe-provision.patch https://raw.githubusercontent.com/a7987083/UnitXP_SP3-Moonstone/v3.0.0-alphaone13/HFASign/patches/0017-Fix-Zsign-removeProvision-semantics.patch
          git -C Vendor/Zsign apply /tmp/zonoe-provision.patch


      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Xcode version
        run: xcodebuild -version

      - name: Build GameStore for iOS 13 deployment target
        run: |
          set -o pipefail
          xcodebuild \
            -skipPackagePluginValidation \
            -project GameStore.xcodeproj \
            -scheme GameStore \
            -configuration Debug \
            -sdk iphonesimulator \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild-legacy.log

      - name: Build unsigned device app
        run: |
          set -o pipefail
          rm -rf DerivedDataDevice
          xcodebuild \
            -skipPackagePluginValidation \
            -project GameStore.xcodeproj \
            -scheme GameStore \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath DerivedDataDevice \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee xcodebuild-device.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="DerivedDataDevice/Build/Products/Debug-iphoneos/GameStore.app"
          test -d "$APP_PATH"
          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/GameStore.app
          (
            cd ipa
            /usr/bin/zip -qry ../GameStore-v0.2.8-dev-unsigned.ipa Payload
          )
          /usr/bin/unzip -l GameStore-v0.2.8-dev-unsigned.ipa | tee ipa-contents.log
          test -s GameStore-v0.2.8-dev-unsigned.ipa
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PATH/Info.plist" | grep -Fx "0.2.8"
          /usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP_PATH/Info.plist" | grep -Fx "9"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GameStore-v0.2.8-dev-unsigned-ipa
          path: GameStore-v0.2.8-dev-unsigned.ipa
          if-no-files-found: error

      - name: Upload legacy build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-legacy-logs
          path: |
            xcodebuild-legacy.log
            xcodebuild-device.log
            ipa-contents.log
          if-no-files-found: ignore

  modern-ios26:
    name: Modern iOS 26 SDK / Xcode 26.6
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Restore pinned zonoe Zsign package
        run: |
          set -euo pipefail
          git clone https://github.com/Nyasami/Ksign.git upstream-ksign
          git -C upstream-ksign checkout 03a3a9c86897d79f9faf8106037b9971841d56a0
          git -C upstream-ksign submodule update --init --recursive
          test "$(git -C upstream-ksign/Zsign rev-parse HEAD)" = "6ffe703df73ef9069adacdbb19d571f11a69a801"
          mkdir -p Vendor
          cp -R upstream-ksign/Zsign Vendor/Zsign
          curl -fLsS --retry 3 -o /tmp/zonoe-provision.patch https://raw.githubusercontent.com/a7987083/UnitXP_SP3-Moonstone/v3.0.0-alphaone13/HFASign/patches/0017-Fix-Zsign-removeProvision-semantics.patch
          git -C Vendor/Zsign apply /tmp/zonoe-provision.patch


      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Xcode version
        run: xcodebuild -version

      - name: Build GameStore against iOS 26 SDK
        run: |
          set -o pipefail
          xcodebuild \
            -skipPackagePluginValidation \
            -project GameStore.xcodeproj \
            -scheme GameStore \
            -configuration Debug \
            -sdk iphonesimulator \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild-modern.log

      - name: Upload modern build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-modern-log
          path: xcodebuild-modern.log
