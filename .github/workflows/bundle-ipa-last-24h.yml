name: Package all IPA builds (last 24h)
on:
  push:
    branches:
      - tools/package-all-ipa-24h-20261010
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Gather last 24h IPA artifacts and create ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import csv, datetime as dt, io, json, os, time, urllib.request, zipfile
          from pathlib import Path

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          end = dt.datetime.now(dt.timezone.utc)
          begin = end - dt.timedelta(hours=24)
          Path("dist").mkdir(exist_ok=True)
          output = Path("dist/GameStore-IPA-All-Builds-Last24h.zip")
          headers = {"Authorization": "Bearer " + token,
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28",
                     "User-Agent": "GameStore-IPA-Bundler"}
          def get(url):
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(req, timeout=90) as res:
                          return res.read()
                  except Exception:
                      if attempt == 3: raise
                      time.sleep(3 * (attempt + 1))
          def as_dt(value):
              return dt.datetime.fromisoformat(value.replace("Z","+00:00"))

          artifacts = []
          page = 1
          while True:
              result = json.loads(get(f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}"))
              batch = result.get("artifacts", [])
              for item in batch:
                  created = as_dt(item["created_at"])
                  if begin <= created <= end and not item.get("expired") and "ipa" in item["name"].lower():
                      artifacts.append(item)
              print(f"Page {page}: {len(batch)} artifacts, matches so far {len(artifacts)}", flush=True)
              if len(batch) < 100 or as_dt(batch[-1]["created_at"]) < begin:
                  break
              page += 1
              if page > 30: raise RuntimeError("Artifact pagination exceeded safety limit")

          rows, errors = [], []
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as bundle:
              for i, item in enumerate(sorted(artifacts, key=lambda a: a["created_at"]), 1):
                  run = item.get("workflow_run") or {}
                  run_id = run.get("id", "unknown")
                  sha = run.get("head_sha") or "unknown"
                  archive_name = f"GameStore_run{run_id}_{sha[:10]}_artifact{item['id']}"
                  try:
                      raw = get(item["archive_download_url"])
                      with zipfile.ZipFile(io.BytesIO(raw)) as artifact_zip:
                          ipa_paths = [name for name in artifact_zip.namelist() if name.lower().endswith(".ipa") and not name.endswith("/")]
                          if not ipa_paths:
                              errors.append({"artifact_id": item["id"], "run_id": run_id, "reason": "No IPA in artifact ZIP"})
                              continue
                          for idx, filename in enumerate(ipa_paths, 1):
                              payload = artifact_zip.read(filename)
                              dest = f"IPA/{archive_name}_{idx}.ipa"
                              bundle.writestr(dest, payload)
                              rows.append({"file": dest, "artifact_id": item["id"], "run_id": run_id,
                                           "commit": sha, "created_utc": item["created_at"],
                                           "original_file": filename, "bytes": len(payload),
                                           "actions_url": f"https://github.com/{repo}/actions/runs/{run_id}"})
                      print(f"{i}/{len(artifacts)}: {run_id} -> {len(ipa_paths)} IPA", flush=True)
                  except Exception as exc:
                      errors.append({"artifact_id": item["id"], "run_id": run_id, "reason": str(exc)})
                      print(f"Warning: {item['id']}: {exc}", flush=True)

              csvbuf = io.StringIO()
              writer = csv.DictWriter(csvbuf, fieldnames=["file","artifact_id","run_id","commit","created_utc","original_file","bytes","actions_url"])
              writer.writeheader(); writer.writerows(rows)
              bundle.writestr("BUILD_MANIFEST.csv", csvbuf.getvalue().encode("utf-8-sig"))
              bundle.writestr("README.txt", (f"GameStore IPA builds created in prior 24 hours (UTC):\n"
                                              f"From: {begin.isoformat()}\nTo: {end.isoformat()}\n"
                                              f"Distinct build artifacts: {len(artifacts)}\n"
                                              f"IPA files collected: {len(rows)}\n"
                                              f"Failures: {len(errors)}\n"
                                              f"See BUILD_MANIFEST.csv and ERRORS.json.\n").encode("utf-8"))
              bundle.writestr("ERRORS.json", json.dumps(errors, indent=2, ensure_ascii=False))
          print(f"FINISHED: IPA count={len(rows)}, errors={len(errors)}, output={output.stat().st_size} bytes", flush=True)
          if not rows: raise RuntimeError("No IPA files could be collected")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: GameStore-all-IPAs-last-24h
          path: dist/GameStore-IPA-All-Builds-Last24h.zip
          if-no-files-found: error
          retention-days: 7
